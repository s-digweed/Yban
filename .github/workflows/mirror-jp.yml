name: Mirror JP-IPTV

on:
  schedule:
    # 06:00 UTC = 9am KSA, 16:00 UTC = 7pm KSA
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mirror_jp.py"
      - ".github/workflows/mirror-jp.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Mirror playlists and EPG
        run: python mirror_jp.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.m3u' jp_epg.xml.gz
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mirror JP-IPTV $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
