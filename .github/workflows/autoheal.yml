name: Autoheal YB playlists

on:
  schedule:
    # 06:00 UTC = 9am KSA, 16:00 UTC = 7pm KSA
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Dry run - report what would change, write nothing (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  autoheal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Heal playlists
        run: |
          if [ "${{ github.event.inputs.check_only }}" = "true" ]; then
            python autoheal.py --check --verbose
          else
            python autoheal.py --verbose
          fi

      - name: Fetch EPG
        run: python fetch_epg.py
        continue-on-error: true

      - name: Commit and push if changed
        if: github.event.inputs.check_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.m3u' yban_epg.xml.gz .autoheal_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Autoheal $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
          
